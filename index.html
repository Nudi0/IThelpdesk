<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in – HelpDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('helpdesk_theme') || 'light');
  </script>
</head>
<body class="login-body">

  <main class="login-center">
    <button type="button" class="theme-toggle theme-toggle-float" data-theme-toggle aria-pressed="false">Dark</button>
    <p class="login-kicker">Internal · IT Operations</p>

    <section class="login-card-box">
      <div class="login-brand">
        <span class="brand-mark">HD</span>
        <span class="brand-name">HelpDesk</span>
      </div>
      <h1>Welcome back</h1>
      <p class="login-subtitle">Sign in with your work account to continue.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Work email</label>
          <input type="email" id="loginEmail" name="email" autocomplete="username" placeholder="nina.okonkwo@company.com" required />
        </div>
        <div class="form-group">
          <div class="field-label-row">
            <label for="loginPassword">Password</label>
            <button type="button" class="text-link" id="forgotPassword">Forgot password?</button>
          </div>
          <div class="password-field">
            <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" required />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
          </div>
        </div>
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" />
          Keep me signed in
        </label>
        <p class="error-msg" id="loginError" hidden></p>
        <button type="submit" class="btn btn-primary login-submit">Continue</button>
      </form>
      <p class="login-footnote">Protected network · Authorized staff only</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
